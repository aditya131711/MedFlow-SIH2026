<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MedFlow — SIH 2026 healthcare workflow MVP prototype" />
  <title>MedFlow — SIH 2026 MVP</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #F6F8F8; }
    * { box-sizing: border-box; }
    button, input, select, textarea { font: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;
const IconFallback = ({ size = 18, color = "currentColor", className = "", strokeWidth = 2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className} aria-hidden="true">
    <circle cx="12" cy="12" r="8" stroke={color} strokeWidth={strokeWidth} />
    <path d="M9 12h6M12 9v6" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" />
  </svg>
);

// The UMD build normally exposes lucideReact. If the CDN fails or exposes a
// different global name, use fallback icons instead of crashing the whole app.
const lucideSource = window.lucideReact || window.LucideReact || {};
const lucideReact = new Proxy(lucideSource, {
  get: (target, key) => target[key] || IconFallback
});

const {
  Activity, Stethoscope, ClipboardList, Users, Pill, ShieldCheck, LayoutDashboard,
  UserPlus, HeartPulse, ListOrdered, FileText, QrCode, History, Wifi, WifiOff,
  Languages, Lock, CheckCircle2, XCircle, AlertTriangle, ChevronRight, ChevronLeft,
  ArrowRight, Play, X, ClipboardCheck, Syringe, ScanLine, BadgeCheck, Clock,
  ShieldAlert, Database, RefreshCw, LogOut, Home, Bell, User, ScrollText
} = lucideReact;

/* ============================================================
   MedFlow — vertexiQ · SIH 2026 (SIH26133)
   Single-file clickable MVP prototype.
   All state is in-memory (React state). No backend calls.
   ============================================================ */

/* ---------------- Design tokens ---------------- */
const C = {
  navy: "#0B2E33",
  navyDeep: "#082226",
  teal: "#0F5C5C",
  tealSoft: "#E4F1EF",
  sky: "#2E9BD6",
  skySoft: "#E7F4FC",
  coral: "#E1562F",
  coralSoft: "#FBE7E0",
  amber: "#E8A33D",
  amberSoft: "#FCF0DD",
  green: "#2F9E64",
  greenSoft: "#E5F5EC",
  bg: "#F6F8F8",
  card: "#FFFFFF",
  text: "#152B2E",
  muted: "#5B6E70",
  faint: "#8FA0A1",
  border: "#E1E8E8",
};

const FONTS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
.mf-root { font-family: 'Inter', sans-serif; color: ${C.text}; }
.mf-display { font-family: 'Space Grotesk', sans-serif; }
.mf-mono { font-family: 'IBM Plex Mono', monospace; }
.mf-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.mf-scroll::-webkit-scrollbar-thumb { background: ${C.border}; border-radius: 8px; }
@keyframes mf-pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.mf-live { animation: mf-pulse 1.8s ease-in-out infinite; }
@keyframes mf-slide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.mf-in { animation: mf-slide .28s ease-out; }
`;

/* ---------------- Small primitives ---------------- */
const Card = ({ children, style, className = "", pad = "p-5", onClick }) => (
  <div
    className={`rounded-2xl ${pad} ${className}`}
    onClick={onClick}
    style={{ background: C.card, border: `1px solid ${C.border}`, boxShadow: "0 1px 2px rgba(11,46,51,0.04)", ...style }}
  >
    {children}
  </div>
);

const Badge = ({ children, tone = "teal" }) => {
  const tones = {
    teal: { bg: C.tealSoft, fg: C.teal },
    coral: { bg: C.coralSoft, fg: C.coral },
    amber: { bg: C.amberSoft, fg: "#8A5B14" },
    green: { bg: C.greenSoft, fg: C.green },
    sky: { bg: C.skySoft, fg: C.sky },
    gray: { bg: "#EFF2F2", fg: C.muted },
  };
  const t = tones[tone] || tones.teal;
  return (
    <span
      className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold"
      style={{ background: t.bg, color: t.fg }}
    >
      {children}
    </span>
  );
};

const Btn = ({ children, onClick, variant = "primary", icon: Icon, className = "", disabled, type = "button" }) => {
  const base = "inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition-all";
  const styles = {
    primary: { background: C.navy, color: "#fff" },
    coral: { background: C.coral, color: "#fff" },
    sky: { background: C.sky, color: "#fff" },
    outline: { background: "transparent", color: C.navy, border: `1.5px solid ${C.navy}` },
    ghost: { background: "transparent", color: C.muted },
    subtle: { background: C.tealSoft, color: C.teal },
  };
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      className={`${base} ${className} ${disabled ? "opacity-40 cursor-not-allowed" : "hover:opacity-90 active:scale-[0.98]"}`}
      style={styles[variant]}
    >
      {Icon && <Icon size={16} strokeWidth={2.3} />}
      {children}
    </button>
  );
};

const SectionLabel = ({ eyebrow, title, sub }) => (
  <div className="mb-5">
    {eyebrow && (
      <div className="mf-mono text-xs tracking-wider uppercase mb-1.5" style={{ color: C.sky }}>
        {eyebrow}
      </div>
    )}
    <h2 className="mf-display text-2xl font-semibold" style={{ color: C.navy }}>{title}</h2>
    {sub && <p className="text-sm mt-1.5" style={{ color: C.muted }}>{sub}</p>}
  </div>
);

const Field = ({ label, children }) => (
  <label className="block">
    <span className="text-xs font-semibold mb-1.5 block" style={{ color: C.muted }}>{label}</span>
    {children}
  </label>
);

const inputStyle = {
  width: "100%", border: `1.5px solid ${C.border}`, borderRadius: 10, padding: "9px 12px",
  fontSize: 14, outline: "none", background: "#fff", color: C.text,
};
const Input = (props) => <input {...props} style={{ ...inputStyle, ...(props.style || {}) }} className="focus:ring-2" />;
const Select = ({ children, ...props }) => <select {...props} style={inputStyle}>{children}</select>;
const TextArea = (props) => <textarea {...props} style={{ ...inputStyle, resize: "vertical", ...(props.style || {}) }} />;

const priorityTone = (p) => (p === "Emergent" || p === "High" ? "coral" : p === "Urgent" || p === "Moderate" ? "amber" : "green");

/* ---------------- Journey stage config ---------------- */
const STAGES = [
  { key: "registration", label: "Registration", icon: UserPlus },
  { key: "symptoms", label: "Symptoms", icon: ClipboardList },
  { key: "triage", label: "Triage", icon: Activity },
  { key: "validation", label: "Nurse Validation", icon: ShieldCheck },
  { key: "queue", label: "Queue", icon: ListOrdered },
  { key: "doctor", label: "Doctor", icon: Stethoscope },
  { key: "prescription", label: "Prescription", icon: FileText },
  { key: "pharmacy", label: "Pharmacy", icon: Pill },
  { key: "record", label: "Patient Record", icon: History },
];

/* ---------------- Seed data ---------------- */
const seedPatients = () => ({
  P001: {
    id: "P001", encounterId: "ENC-98213", name: "Rohan Kadam", age: 34, gender: "Male",
    mobile: "98•••••210", address: "Ambernath, Thane", language: "English",
    newOrExisting: "New", history: "No known chronic conditions.", emergencyContact: "Priya Kadam (Spouse)",
    registeredAt: null, stage: "landing",
    symptoms: null, vitals: null, triage: null, queuePos: null, consult: null,
    prescription: null, pharmacy: null,
    pastVisits: [
      { date: "12 Feb 2026", doctor: "Dr. Anjali Mehta", encounterId: "ENC-77410", summary: "Seasonal viral fever — prescribed antipyretics, advised rest.", },
    ],
  },
  PA: {
    id: "PA", name: "Patient A", age: 58, gender: "Male", presentation: "Chest pain, BP 160/95, SpO₂ 92%",
    systemRec: "High Priority", esi: "ESI Level 2 — Emergent", nurseAction: "Validated → moved to front of queue", finalPriority: "Emergent",
  },
  PB: {
    id: "PB", name: "Patient B", age: 27, gender: "Female", presentation: "Fever 39°C, cough, normal vitals",
    systemRec: "Moderate Priority", esi: "ESI Level 3 — Urgent", nurseAction: "Confirmed → queued accordingly", finalPriority: "Urgent",
  },
  PC: {
    id: "PC", name: "Patient C", age: 41, gender: "Male", presentation: "Minor cut, stable vitals",
    systemRec: "Low Priority", esi: "ESI Level 4 — Less Urgent", nurseAction: "Validated → queued last", finalPriority: "Less Urgent",
  },
});

const nowTime = () => new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });

/* ============================================================
   ROOT APP
   ============================================================ */
function MedFlowPrototype() {
  const [role, setRole] = useState(null); // patient | nurse | doctor | pharmacist | admin
  const [screen, setScreen] = useState(null);
  const [patients, setPatients] = useState(seedPatients);
  const [audit, setAudit] = useState([
    { time: "09:58 AM", actor: "System", action: "Session initialized — MedFlow demo environment ready." },
  ]);
  const [offline, setOffline] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [language, setLanguage] = useState("English");
  const [demo, setDemo] = useState({ active: false, step: -1 });
  const [selectedPatientId, setSelectedPatientId] = useState("P001");
  const [toast, setToast] = useState(null);

  const p001 = patients.P001;

  const logAction = (action, actor = role ? role[0].toUpperCase() + role.slice(1) : "System") => {
    setAudit((a) => [{ time: nowTime(), actor, action }, ...a]);
  };

  const showToast = (msg) => {
    setToast(msg);
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 2600);
  };

  const updatePatient = (id, patch) =>
    setPatients((prev) => ({ ...prev, [id]: { ...prev[id], ...patch } }));

  /* ---------- Demo mode script ---------- */
  const demoScript = [
    { role: "patient", screen: "registration", note: "Patient P001 arrives at reception and registers." },
    { role: "patient", screen: "symptoms", note: "Patient reports symptoms and basic vitals are captured." },
    { role: "nurse", screen: "triage", note: "Protocol-based triage generates a system recommendation for nurse review." },
    { role: "nurse", screen: "dashboard", note: "Nurse validates the recommendation — priority is confirmed." },
    { role: "patient", screen: "queue", note: "Queue updates in real time; patient sees live position." },
    { role: "doctor", screen: "context", note: "Doctor opens the patient — full pre-filled context, no re-entry." },
    { role: "doctor", screen: "consultation", note: "Doctor completes consultation notes and assessment." },
    { role: "doctor", screen: "prescription", note: "Structured e-prescription generated with a unique QR ID." },
    { role: "pharmacist", screen: "verify", note: "Pharmacist scans the QR and verifies the prescription." },
    { role: "patient", screen: "record", note: "Encounter is stored — one continuous digital patient record." },
  ];

  const runDemoStep = (i) => {
    if (i < 0 || i >= demoScript.length) return;
    const s = demoScript[i];
    setRole(s.role);
    setScreen(s.screen);
    setDemo({ active: true, step: i });

    // Apply state transitions so each screen shows the right data at the right time
    if (s.screen === "registration" && !p001.registeredAt) {
      updatePatient("P001", { registeredAt: nowTime(), stage: "registration" });
      logAction("Patient registered — Reception", "Reception");
    }
    if (s.screen === "symptoms") {
      updatePatient("P001", {
        symptoms: { complaint: "Sudden high fever with chills, mild breathlessness", list: "Fever, chills, fatigue, mild breathlessness", duration: "Since last night (~14 hrs)", relevantHistory: "No known chronic illness. No known drug allergies." },
        vitals: { bp: "128/84", pulse: "104 bpm", spo2: "95%", temp: "39.4°C" },
        stage: "symptoms",
      });
      logAction("Symptoms & vitals captured — Reception", "Reception");
    }
    if (s.screen === "triage" && role !== "nurse") {
      // pre-compute triage rec so nurse dashboard has it
    }
    if (i === 2) {
      updatePatient("P001", {
        triage: { systemRec: "Urgent", protocol: "ESI (Emergency Severity Index) — configured for demo", validation: null, finalPriority: null },
        stage: "triage",
      });
      logAction("Priority recommendation generated — System", "System");
    }
    if (i === 3) {
      updatePatient("P001", {
        triage: {
          ...(p001.triage || {
            systemRec: "Urgent",
            protocol: "ESI (Emergency Severity Index) — configured for demo"
          }),
          validation: {
            status: "Accepted",
            note: "Vitals consistent with system recommendation.",
            by: "Nurse Kavita Rao",
            at: nowTime()
          },
          finalPriority: "Urgent"
        },
        queuePos: 2,
        stage: "queue"
      });
      logAction("Recommendation validated — Nurse Kavita Rao", "Nurse");
    }
    if (i === 5) {
      updatePatient("P001", { stage: "doctor" });
    }
    if (i === 6) {
      logAction("Consultation started — Dr. Ansari", "Doctor");
    }
    if (i === 7) {
      updatePatient("P001", {
        consult: { notes: "Patient presents with febrile illness, likely viral. No signs of respiratory distress at rest. Advised symptomatic management and review in 48 hrs if unresolved.", assessment: "Probable viral fever — routine workup", followUp: "Review in 48 hours if fever persists; return sooner if breathlessness worsens." },
        prescription: { doctor: "Dr. S. Ansari", datetime: nowTime(), qrId: "RX-MF-77281", items: [
          { name: "Paracetamol", strength: "650mg", dosage: "1 tablet", frequency: "Every 6 hrs (SOS)", duration: "3 days", instructions: "After food" },
          { name: "Cetirizine", strength: "10mg", dosage: "1 tablet", frequency: "Once daily (night)", duration: "3 days", instructions: "After food" },
          { name: "ORS Sachets", strength: "—", dosage: "1 sachet in 1L water", frequency: "As needed", duration: "3 days", instructions: "Maintain hydration" },
        ] },
        stage: "prescription",
      });
      logAction("Structured prescription generated — Dr. S. Ansari", "Doctor");
    }
    if (i === 8) {
      updatePatient("P001", { pharmacy: { status: "Verified & Dispensed", at: nowTime() }, stage: "pharmacy" });
      logAction("Prescription verified & dispensed — Pharmacist M. Iyer", "Pharmacist");
    }
    if (i === 9) {
      updatePatient("P001", { stage: "record" });
      logAction("Encounter closed & stored in patient record — System", "System");
    }
  };

  const startDemo = () => runDemoStep(0);
  const nextDemo = () => runDemoStep(demo.step + 1);
  const prevDemo = () => runDemoStep(Math.max(0, demo.step - 1));
  const exitDemo = () => setDemo({ active: false, step: -1 });

  const goRole = (r) => {
    setRole(r);
    setDemo({ active: false, step: -1 });
    const defaults = { patient: "home", nurse: "dashboard", doctor: "dashboard", pharmacist: "verify", admin: "overview" };
    setScreen(defaults[r]);
  };

  const logout = () => {
    setRole(null); setScreen(null); setDemo({ active: false, step: -1 });
  };

  const toggleOffline = () => {
    if (!offline) {
      setOffline(true);
      showToast("Offline Mode — data stored securely on device");
      logAction("Device went offline — local capture active", "System");
    } else {
      setSyncing(true);
      showToast("Synchronizing…");
      window.setTimeout(() => {
        setSyncing(false);
        setOffline(false);
        showToast("Synced successfully");
        logAction("Reconnected — data synchronized", "System");
      }, 1400);
    }
  };

  /* ---------- shell ---------- */
  return (
    <div className="mf-root min-h-screen w-full" style={{ background: C.bg }}>
      <style>{FONTS}</style>

      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 mf-in">
          <div className="rounded-full px-4 py-2 text-sm font-semibold shadow-lg flex items-center gap-2"
            style={{ background: C.navy, color: "#fff" }}>
            {syncing ? <RefreshCw size={14} className="animate-spin" /> : <CheckCircle2 size={14} />}
            {toast}
          </div>
        </div>
      )}

      {!role ? (
        <Landing onSelectRole={goRole} onStartDemo={() => { goRole("patient"); startDemo(); }} />
      ) : (
        <AppShell
          role={role} screen={screen} setScreen={setScreen} logout={logout}
          offline={offline} toggleOffline={toggleOffline} syncing={syncing}
          language={language} setLanguage={setLanguage}
          demo={demo} nextDemo={nextDemo} prevDemo={prevDemo} exitDemo={exitDemo} demoScript={demoScript}
          patients={patients} p001={p001}
          selectedPatientId={selectedPatientId} setSelectedPatientId={setSelectedPatientId}
          updatePatient={updatePatient} logAction={logAction} showToast={showToast}
          audit={audit} goRole={goRole}
        />
      )}
    </div>
  );
}

/* ============================================================
   LANDING / LOGIN
   ============================================================ */
function Landing({ onSelectRole, onStartDemo }) {
  const roles = [
    { id: "patient", label: "Patient", icon: User, desc: "Register, track your queue, view your prescription" },
    { id: "nurse", label: "Nurse", icon: HeartPulse, desc: "Validate triage, manage the live queue" },
    { id: "doctor", label: "Doctor", icon: Stethoscope, desc: "Consult with full pre-filled patient context" },
    { id: "pharmacist", label: "Pharmacist", icon: Pill, desc: "Scan & verify e-prescriptions" },
    { id: "admin", label: "Hospital Admin", icon: LayoutDashboard, desc: "Monitor flow, audit logs & analytics" },
  ];
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 py-16" style={{ background: `radial-gradient(1200px 600px at 50% -10%, ${C.tealSoft}, ${C.bg})` }}>
      <div className="w-full max-w-4xl mf-in">
        <div className="flex items-center justify-center gap-2 mb-6">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: C.navy }}>
            <Activity size={18} color="#fff" strokeWidth={2.5} />
          </div>
          <span className="mf-display text-xl font-bold tracking-tight" style={{ color: C.navy }}>MedFlow</span>
        </div>
        <h1 className="mf-display text-center text-3xl md:text-4xl font-semibold leading-tight" style={{ color: C.navy }}>
          From Triage to Treatment —<br />One Continuous Digital Patient Journey
        </h1>
        <p className="text-center mt-3 text-sm md:text-base" style={{ color: C.muted }}>
          Protocol-Assisted Triage · Smart Priority Queue · Digital Prescription · Unified Patient Record
        </p>
        <div className="flex items-center justify-center gap-2 mt-4 flex-wrap">
          <Badge tone="sky">Team vertexiQ</Badge>
          <Badge tone="gray">PHCET</Badge>
          <Badge tone="teal">SIH26133</Badge>
          <Badge tone="gray">Smart India Hackathon 2026</Badge>
        </div>

        <div className="mt-10 grid grid-cols-2 md:grid-cols-5 gap-3">
          {roles.map((r) => (
            <button
              key={r.id}
              onClick={() => onSelectRole(r.id)}
              className="text-left rounded-2xl p-4 transition-all hover:-translate-y-0.5"
              style={{ background: C.card, border: `1.5px solid ${C.border}`, boxShadow: "0 1px 2px rgba(11,46,51,0.05)" }}
            >
              <div className="w-9 h-9 rounded-lg flex items-center justify-center mb-3" style={{ background: C.tealSoft }}>
                <r.icon size={18} color={C.teal} strokeWidth={2.2} />
              </div>
              <div className="font-semibold text-sm" style={{ color: C.navy }}>{r.label}</div>
              <div className="text-xs mt-1 leading-snug" style={{ color: C.muted }}>{r.desc}</div>
            </button>
          ))}
        </div>

        <div className="mt-8 flex flex-col items-center gap-3">
          <Btn variant="coral" icon={Play} onClick={onStartDemo}>Start Patient Journey (Guided Demo)</Btn>
          <p className="text-xs" style={{ color: C.faint }}>Walks through one full encounter, role by role, in ~2–3 minutes.</p>
        </div>

        <div className="mt-10 text-center text-xs" style={{ color: C.faint }}>
          The system assists prioritization; qualified healthcare staff make the final clinical decision.
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP SHELL — top bar, journey stepper, demo banner, side nav
   ============================================================ */
function AppShell(props) {
  const { role, screen, setScreen, logout, offline, toggleOffline, syncing, language, setLanguage,
    demo, nextDemo, prevDemo, exitDemo, demoScript, patients, p001, selectedPatientId, setSelectedPatientId,
    updatePatient, logAction, showToast, audit, goRole } = props;

  const navConfig = {
    patient: [
      { key: "home", label: "Home", icon: Home },
      { key: "registration", label: "Registration", icon: UserPlus },
      { key: "symptoms", label: "Symptoms", icon: ClipboardList },
      { key: "queue", label: "Queue", icon: ListOrdered },
      { key: "prescription", label: "Prescription", icon: FileText },
      { key: "record", label: "History", icon: History },
    ],
    nurse: [
      { key: "dashboard", label: "Dashboard", icon: LayoutDashboard },
      { key: "triage", label: "Triage", icon: Activity },
      { key: "samples", label: "Sample Patients", icon: Users },
      { key: "queue", label: "Dynamic Queue", icon: ListOrdered },
    ],
    doctor: [
      { key: "dashboard", label: "Dashboard", icon: LayoutDashboard },
      { key: "context", label: "Patient Context", icon: ClipboardCheck },
      { key: "consultation", label: "Consultation", icon: Stethoscope },
      { key: "prescription", label: "E-Prescription", icon: FileText },
    ],
    pharmacist: [
      { key: "verify", label: "Scan / Verify", icon: ScanLine },
      { key: "dispense", label: "Dispense", icon: Pill },
    ],
    admin: [
      { key: "overview", label: "Hospital Overview", icon: LayoutDashboard },
      { key: "queue", label: "Live Queue", icon: ListOrdered },
      { key: "audit", label: "Audit Trail", icon: ScrollText },
      { key: "security", label: "Security & Roles", icon: ShieldAlert },
    ],
  };
  const items = navConfig[role] || [];
  const roleLabel = { patient: "Patient", nurse: "Nurse", doctor: "Doctor", pharmacist: "Pharmacist", admin: "Hospital Admin" }[role];

  const currentStageIdx = STAGES.findIndex((s) => s.key === p001.stage);

  return (
    <div className="min-h-screen flex flex-col">
      {/* Demo banner */}
      {demo.active && (
        <div className="w-full px-4 md:px-8 py-3" style={{ background: C.navyDeep }}>
          <div className="max-w-7xl mx-auto flex items-center gap-4 flex-wrap">
            <Badge tone="coral">DEMO MODE</Badge>
            <div className="text-sm text-white/90 flex-1 min-w-[200px]">
              <span className="font-semibold">Step {demo.step + 1}/{demoScript.length}:</span> {demoScript[demo.step]?.note}
            </div>
            <div className="flex items-center gap-2">

              const active = i === currentStageIdx;

              return (
                <React.Fragment key={s.key}>

          {items.map((it) => (
            <button key={it.key} onClick={() => setScreen(it.key)}
              className="flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg text-[10px] font-semibold shrink-0"

    </div>
  );
}

/* ============================================================
   SCREEN ROUTER
   ============================================================ */
function ScreenRouter(props) {
  const { role, screen } = props;
  if (role === "patient") {
    if (screen === "home") return <PatientHome {...props} />;
    if (screen === "registration") return <PatientRegistration {...props} />;
    if (screen === "symptoms") return <PatientSymptoms {...props} />;
    if (screen === "queue") return <PatientQueue {...props} />;
    if (screen === "prescription") return <PatientPrescription {...props} />;
    if (screen === "record") return <PatientRecord {...props} />;
  }
  if (role === "nurse") {
    if (screen === "dashboard") return <NurseDashboard {...props} />;
    if (screen === "triage") return <TriageAssessment {...props} />;
    if (screen === "samples") return <SamplePatients {...props} />;
    if (screen === "queue") return <DynamicQueue {...props} />;
  }
  if (role === "doctor") {
    if (screen === "dashboard") return <DoctorDashboard {...props} />;
    if (screen === "context") return <DoctorContext {...props} />;
    if (screen === "consultation") return <DoctorConsultation {...props} />;
    if (screen === "prescription") return <EPrescription {...props} />;
  }
  if (role === "pharmacist") {
    if (screen === "verify") return <PharmacyVerify {...props} />;
    if (screen === "dispense") return <PharmacyDispense {...props} />;
  }
  if (role === "admin") {
    if (screen === "overview") return <AdminOverview {...props} />;
    if (screen === "queue") return <DynamicQueue {...props} />;
    if (screen === "audit") return <AuditTrail {...props} />;
    if (screen === "security") return <SecurityScreen {...props} />;
  }
  return <div>Screen not found.</div>;
}

/* ============================================================

   ============================================================ */
function TriageAssessment({ p001, updatePatient, logAction, showToast, navSetScreen }) {
  const [note, setNote] = useState("");
  if (!p001.symptoms) return <EmptyState title="Awaiting patient data" body="Triage assessment activates once symptoms & vitals are captured." />;

  const generateRec = () => {
    updatePatient("P001", { triage: { systemRec: "Urgent", protocol: "ESI (Emergency Severity Index) — configured for demo", validation: null, finalPriority: null }, stage: "triage" });
    logAction("Priority recommendation generated — System", "System");
  };

  const validate = (action) => {
    const finalPriority = action === "Override" ? note.includes("high") ? "Emergent" : "Routine" : "Urgent";
    updatePatient("P001", {
      triage: { ...p001.triage, validation: { status: action, note: note || "—", by: "Nurse Kavita Rao", at: nowTime() }, finalPriority },
      queuePos: finalPriority === "Emergent" ? 1 : 2, stage: "queue",
    });
    logAction(`Recommendation ${action.toLowerCase()}d — Nurse Kavita Rao`, "Nurse");
    showToast(`Priority ${action.toLowerCase()}d — queue updated`);
  };

  return (
    <div>
      <SectionLabel eyebrow="Screen 5" title="Triage Assessment" sub="Patient Data → Protocol → System Recommendation → Nurse Validation." />
      <div className="grid lg:grid-cols-2 gap-4">
        <Card>
          <div className="text-xs font-semibold mb-3" style={{ color: C.faint }}>PATIENT DATA</div>
          <dl className="space-y-2 text-sm">
            <Row k="Patient ID" v={p001.id} /><Row k="Age" v={p001.age} />
            <Row k="Main complaint" v={p001.symptoms.complaint} />
            <Row k="Duration" v={p001.symptoms.duration} />
            <Row k="History" v={p001.symptoms.relevantHistory} />
            <Row k="BP" v={p001.vitals.bp} /><Row k="Pulse" v={p001.vitals.pulse} />
            <Row k="SpO₂" v={p001.vitals.spo2} /><Row k="Temp" v={p001.vitals.temp} />
          </dl>
        </Card>

        <div className="space-y-4">
          <Card>
            <div className="text-xs font-semibold mb-2" style={{ color: C.faint }}>PROTOCOL / RULE</div>
            <p className="text-sm" style={{ color: C.muted }}>ESI (Emergency Severity Index) — configured for demonstration. Not a proprietary AI diagnosis.</p>
            {!p001.triage ? (
              <div className="mt-3"><Btn icon={Activity} onClick={generateRec}>Generate System Recommendation</Btn></div>
            ) : (
              <div className="mt-3 flex items-center gap-2">
                <Badge tone={priorityTone(p001.triage.systemRec)}>{p001.triage.systemRec}</Badge>
                <span className="text-xs" style={{ color: C.faint }}>System recommendation — not final</span>
              </div>

function EPrescription({ p001, updatePatient, logAction, navSetScreen, showToast }) {
  const [items, setItems] = useState(p001.prescription?.items || [{ name: "", strength: "", dosage: "", frequency: "", duration: "", instructions: "" }]);
  const generated = !!p001.prescription;
  if (!p001.consult) return <EmptyState title="Complete consultation first" body="The e-prescription connects to consultation notes and the patient encounter." />;

  const updateItem = (i, field, val) => setItems((its) => its.map((it, idx) => idx === i ? { ...it, [field]: val } : it));
  const addItem = () => setItems((its) => [...its, { name: "", strength: "", dosage: "", frequency: "", duration: "", instructions: "" }]);

  const generate = () => {
    const qrId = "RX-MF-" + Math.floor(70000 + Math.random() * 9999);
    updatePatient("P001", { prescription: { doctor: "Dr. S. Ansari", datetime: nowTime(), qrId, items }, stage: "prescription" });
    logAction(`Structured prescription generated (${qrId}) — Dr. S. Ansari`, "Doctor");
    showToast("Prescription generated & linked to encounter");
  };

  return (
    <div>
      <SectionLabel eyebrow="Screen 11" title="Structured E-Prescription" sub="Stays permanently linked to Patient ID + Encounter ID." />
      {!generated ? (
        <Card>
          <div className="space-y-3">
            {items.map((it, i) => (
              <div key={i} className="grid grid-cols-2 md:grid-cols-6 gap-2 pb-3" style={{ borderBottom: `1px dashed ${C.border}` }}>
                <Input placeholder="Medicine" value={it.name} onChange={(e) => updateItem(i, "name", e.target.value)} />
                <Input placeholder="Strength" value={it.strength} onChange={(e) => updateItem(i, "strength", e.target.value)} />
                <Input placeholder="Dosage" value={it.dosage} onChange={(e) => updateItem(i, "dosage", e.target.value)} />
                <Input placeholder="Frequency" value={it.frequency} onChange={(e) => updateItem(i, "frequency", e.target.value)} />
                <Input placeholder="Duration" value={it.duration} onChange={(e) => updateItem(i, "duration", e.target.value)} />
                <Input placeholder="Instructions" value={it.instructions} onChange={(e) => updateItem(i, "instructions", e.target.value)} />
              </div>
            ))}
          </div>
          <div className="mt-3 flex gap-2 flex-wrap">
            <Btn variant="outline" onClick={addItem}>+ Add Medicine</Btn>
            <Btn icon={FileText} onClick={generate}>Generate Prescription</Btn>
          </div>
        </Card>
      ) : (
        <>
          <PrescriptionCard p={p001} />
          <div className="mt-4"><Btn variant="outline" icon={ArrowRight} onClick={() => navSetScreen("dashboard")}>Complete Encounter</Btn></div>
        </>
      )}
    </div>
  );
}

            <div className="flex justify-between text-xs mb-1"><span style={{ color: C.text }}>{label}</span><span style={{ color: C.faint }}>{pct}% capacity</span></div>
            <div className="h-2 rounded-full" style={{ background: C.bg }}><div className="h-2 rounded-full" style={{ width: `${pct}%`, background: color }} /></div>
          </div>
        ))}
      </Card>
      <Card pad="p-3" className="mt-4" style={{ background: C.amberSoft, border: "none" }}>
        <p className="text-xs font-semibold" style={{ color: "#8A5B14" }}>All figures on this screen are demo data for illustration only.</p>
      </Card>
    </div>
  );
}

function AuditTrail({ audit }) {
  return (
    <div>
      <SectionLabel eyebrow="Screen 15" title="Audit Trail" sub="Every decision, override, and access event — timestamped and attributable." />
      <Card pad="p-0">
        <div className="max-h-[520px] overflow-y-auto mf-scroll">
          {audit.map((a, i) => (
            <div key={i} className="flex items-start gap-3 px-4 py-3" style={{ borderBottom: `1px solid ${C.border}` }}>
              <span className="mf-mono text-xs shrink-0 pt-0.5" style={{ color: C.faint }}>{a.time}</span>
              <Badge tone="gray">{a.actor}</Badge>
              <span className="text-sm" style={{ color: C.text }}>{a.action}</span>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function SecurityScreen() {
  const rows = [
    { role: "Patient", access: "Own registration, symptoms, queue status, and prescriptions only." },
    { role: "Nurse", access: "Triage and queue information for patients under their care." },
    { role: "Doctor", access: "Authorized clinical information — context, consultation, prescriptions." },
    { role: "Pharmacist", access: "Authorized prescription information for verification & dispensing." },
    { role: "Admin", access: "Aggregate flow, analytics, and audit logs — not individual clinical notes." },
  ];
  const features = [
    { icon: Lock, label: "Role-Based Access Control", desc: "Each role sees only what its function requires." },
    { icon: ShieldCheck, label: "Authentication & Authorization", desc: "JWT-based sessions with per-role permissions." },
    { icon: Database, label: "Encryption", desc: "Data encrypted at rest and in transit." },
    { icon: ScrollText, label: "Audit Logs", desc: "Every access and decision event is logged." },
  ];
  return (
    <div>
      <SectionLabel eyebrow="Screen 16" title="Security & Role Management" sub="Minimum necessary access, enforced structurally — not by convention." />
      <div className="grid md:grid-cols-2 gap-3 mb-5">
        {features.map((f) => (
          <Card key={f.label} className="flex items-start gap-3" style={{ display: "flex" }}>
            <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ background: C.tealSoft }}><f.icon size={16} color={C.teal} /></div>
            <div><div className="font-semibold text-sm" style={{ color: C.navy }}>{f.label}</div><div className="text-xs mt-0.5" style={{ color: C.muted }}>{f.desc}</div></div>
          </Card>
        ))}
      </div>
      <Card pad="p-0">
        {rows.map((r, i) => (
          <div key={r.role} className="flex items-center gap-4 px-4 py-3" style={{ borderTop: i ? `1px solid ${C.border}` : "none" }}>
            <div className="w-28 shrink-0"><Badge tone="teal">{r.role}</Badge></div>
            <div className="text-sm" style={{ color: C.muted }}>{r.access}</div>
          </div>
        ))}
      </Card>
    </div>
  );
}

  return (
    <Card className="text-center py-14">
      <ClipboardList size={30} color={C.faint} className="mx-auto" />
      <div className="font-semibold text-sm mt-3" style={{ color: C.navy }}>{title}</div>
      <p className="text-xs mt-1 max-w-xs mx-auto" style={{ color: C.muted }}>{body}</p>
    </Card>
  );
}
